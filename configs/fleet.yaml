# Fleet configuration - robot specs and initial positions/work sites

# Fixed locations where robots operate
layout:
  landing_zone: [2, 2]           # Shared touchdown: loaders, assemblers & the Pod start here; anchors/airlock staged here
  producer_sites: [[5, 35], [35, 35]]  # Positions of stationary producer plants
  regolith_pits: [[8, 35], [32, 35]]   # Where loaders excavate regolith

# Robot fleet composition and capabilities
robots:
  loaders:
    - speed: 6.0
      grade_time: 2.0
      excavate_time: 1.0
      unload_time: 1.0
      loader_capacity: 4
      grade_neighborhood: 1
      excavate_depth_m: 0.30
      deposit_height_m: 0.30
      sensors:
        gt: { publish_hz: 2.0 }
    - speed: 6.0
      grade_time: 2.0
      excavate_time: 1.0
      unload_time: 1.0
      loader_capacity: 4
      grade_neighborhood: 1
      excavate_depth_m: 0.30
      deposit_height_m: 0.30
      sensors:
        gt: { publish_hz: 2.0 }
    - speed: 6.0
      grade_time: 2.0
      excavate_time: 1.0
      unload_time: 1.0
      loader_capacity: 4
      grade_neighborhood: 1
      excavate_depth_m: 0.30
      deposit_height_m: 0.30
      sensors:
        gt: { publish_hz: 2.0 }
  producers:
    - speed: 2.0
      produce_time: 6.0
      regolith_per_block: 2
      sensors:
        gt: { publish_hz: 1.0 }  # Stationary producers can update less frequently
    - speed: 2.0
      produce_time: 6.0
      regolith_per_block: 2
      sensors:
        gt: { publish_hz: 1.0 }
  assemblers:
    - speed: 6.0
      anchor_drive_time: 4.0
      block_place_time: 3.0
      dock_time: 8.0
      sensors:
        gt: { publish_hz: 2.0 }
    - speed: 6.0
      anchor_drive_time: 4.0
      block_place_time: 3.0
      dock_time: 8.0
      sensors:
        gt: { publish_hz: 2.0 }
  pod:                  # The habitat: lands with the fleet, drives to center, then inflates
    speed: 4.0
    inflate_time: 6.0
    sensors:
      gt: { publish_hz: 2.0 }
