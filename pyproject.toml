[project]
name = "moon-base-sim"
version = "0.1.0"
description = "SimPy lunar base mission with a Pygame top-down visualization."
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "simpy>=4.1.1",
]

[project.scripts]
moon-base-sim = "moon_base_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moon_base_sim"]
